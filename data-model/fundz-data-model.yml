fusion_endpoint:
  path: GET /companies/{id}
  documented_at: https://app.fundz.net/knowledge/api-references/companies
  in_openapi: false
  description: >-
    The inverse of the feed model: one call returns an Organization plus a `signals` object
    grouping the latest events of each type (fundings, acquisitions, executives, agreements,
    product_launches, sec_filings, expansions), a `counts` summary, and `last_signal_at`. This is
    the entity-centric read; the six feeds are the event-centric read.
  gap: >-
    NOT declared in the published OpenAPI, which documents only the six feed paths. The same is
    true of GET /fund-formations. Two of the API's most-marketed endpoints are outside the
    machine-readable contract.
external_identifiers:
- {field: source_url, entity: Funding, description: 'Public source the event was extracted from — press release, filing or announcement.'}
- {field: sec_url, entity: Crowdfunding, description: sec.gov URL for the underlying Form C / Form 1-A filing.}
- {field: linkedin_url, entity: Organization}
- {field: ticker, entity: Organization, description: Stock ticker for public companies.}
- {field: domain.name, entity: Organization, description: 'Bare domain host — the de-facto join key against other datasets.'}
temporal_key:
  field: created_at
  description: >-
    When Fundz published the event, UTC. The documented field to poll on, and the sort key —
    every feed is newest-first. `created_from`/`created_to` filter against it.
