findings:
- >-
  No RFC 9116 security.txt on any host, so there is no machine-readable vulnerability-disclosure
  contact. The probe-security-programs.py pass separately found no disclosure page and no bug
  bounty program.
- >-
  No RFC 9727 api-catalog, so the two API surfaces Fundz runs on api.fundz.net (the feed endpoints
  and the /v1/watch/* FundzWatch endpoints) are not discoverable from the host itself.
- >-
  No /.well-known/agent-card.json and no legacy /.well-known/agent.json on any host — no A2A agent
  card exists for Fundz, so no a2a/ artifact was written.
- >-
  No OIDC or RFC 8414 metadata. Consistent with the auth model: a raw API key in the Authorization
  header, plus a Bearer access token accepted for ChatGPT/agent integrations, with no advertised
  authorization server.
