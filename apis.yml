- aid: fundz:fundzwatch-api
  name: FundzWatch API
  description: >-
    The agent-facing Fundz surface, served on the same host under /v1/watch/*: AI-scored leads
    matched to an ICP, a raw business-event feed, a company watchlist, nightly market aggregates,
    and signed webhooks. It is a separate product from the Fundz event feeds — different auth
    (Bearer with fundz_test_/fundz_live_ key prefixes), a free Developer tier, and the surface the
    first-party Python SDK and MCP server actually call. Documented in prose only; no OpenAPI is
    published for it.
  humanURL: https://fundzwatch.ai/docs
