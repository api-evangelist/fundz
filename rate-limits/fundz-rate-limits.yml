description: >-
  Fundz publishes hard per-plan quotas for both of its API surfaces, and reports the remaining
  allowance in the body of every successful response. What it does NOT do is signal limits in
  response headers — there is no RateLimit-*, X-RateLimit-* or Retry-After header on any observed
  response, so an agent must parse `meta.remaining_searches` out of the payload to pace itself.
verified: '2026-08-14'
limit_count: 5
enforcement:
  status_code: 429
  retry_after_header: false
  response_headers: []
  headers_note: >-
    PROBED 2026-08-14: GET https://api.fundz.net/fundings returned HTTP 403 with headers
    content-type, server (nginx/1.4.6 Ubuntu), x-content-type-options, x-request-id, x-runtime —
    and no rate-limit header of any kind. The runtime signal is in the body, not the headers.
  body_signal:
    on_success: '{ "meta": { "tier": "Pro", "remaining_searches": 97 } }'
    on_exhaustion: '{ "error": "rate_limit_exceeded", "current_tier": "Pro", "queries_limit": 50, "remaining_searches": 0, "upgrade_url": "https://www.fundz.net/pricing" }'
  free_queries: >-
    A query that returns no results does not count against the quota; the response carries a
    `guidance` object instead.
  guidance: >-
    The API reference tells integrators not to hardcode per-plan numbers and to read
    meta.remaining_searches instead.
