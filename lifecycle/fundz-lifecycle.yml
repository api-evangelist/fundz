status_page:
  url: null
  published: false
  probes:
  - {url: 'https://status.fundz.net', status: 000, note: 'DNS does not resolve'}
  - {url: 'https://fundz.statuspage.io', status: 200, note: 'NOT a Fundz status page — redirects to atlassian.com/software/statuspage, the Statuspage product marketing site. A naive 200 check would credit this falsely.'}
  - {url: 'https://www.fundz.net/security', status: 404}
  note: >-
    No incident communication channel of any kind. NO `StatusPage` pointer is emitted in apis.yml.
changelog:
  url: null
  published: false
  probes:
  - {url: 'https://www.fundz.net/changelog', status: 404}
  - {url: 'https://app.fundz.net/knowledge/changelog', status: 404}
  note: >-
    The knowledge base marks recently-updated articles with a "New" badge but publishes no dated
