method: searched
source: https://app.fundz.net/knowledge/api-references/authentication, https://fundzwatch.ai/docs, https://www.fundz.net/terms, openapi/_original/fundz-openapi.json
description: >-
  Fundz publishes no versioning policy, no deprecation policy, no SLA and no status page. What it
  does publish is a stability label on one surface and a document version in the spec. This file
  records what exists and, explicitly, what does not — the operational-transparency surface is the
  weakest part of the Fundz API posture.
verified: '2026-08-14'
versioning:
  core_api:
    scheme: none
    current: null
    example: https://api.fundz.net/fundings
    note: >-
      The feed and company endpoints carry no version segment, no version header and no date-based
      version. A breaking change would arrive unannounced.
  fundzwatch_api:
    scheme: uri-path
    current: v1
    stability: STABLE
    example: https://api.fundz.net/v1/watch/events
    source: https://fundzwatch.ai/docs
    note: The docs label the surface "v1 STABLE". No policy states what a v2 would mean or how long v1 would run.
  specification:
    document_version: 1.1.0
    source: openapi/_original/fundz-openapi.json (info.version)
    published_at: https://github.com/Fund-z/fundz-api-spec
    note: >-
      The spec is versioned in a public GitHub repository, so `git log` on Fund-z/fundz-api-spec is
      currently the only change history a consumer has.
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    No deprecation policy page, no Sunset/Deprecation header support, and no notice period stated
    in the Terms of Service. NO `Deprecation` pointer is emitted in apis.yml.
