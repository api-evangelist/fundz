gaps:
- No stable machine error codes — the only discriminator is the HTTP status plus a free-text `type` string.
- No error `type` URI namespace, so errors are not individually documentable or linkable.
- 400 and 422 are documented in the knowledge base but not declared in the OpenAPI; the spec understates the error surface.
- The 401 the docs describe is not in the spec at all, which instead documents 403 for the same condition.
