description: >-
  Binding between the 14 FundzWatch MCP tools and the machine-readable REST contract. The headline
  finding is a SURFACE SPLIT: the MCP server does not front the OpenAPI. It fronts the FundzWatch
  API (api.fundz.net/v1/watch/*), which has documented endpoints but NO OpenAPI, while the six
  operations that DO have an OpenAPI (the /fundings-style feeds) have no MCP tool of their own.
  Only one tool — get_events — overlaps the spec'd surface, and even then by semantics rather than
  by a shared operationId. Every crosswalk row below is therefore honestly graded low or medium
  confidence; nothing here was upgraded to make the coverage look better than it is.
