findings:
- >-
  MCP and OpenAPI describe two different products at Fundz. The MCP server is the front door to
  FundzWatch (cohorts, scoring, UCC, Form 5500); the OpenAPI is the contract for the Fundz event
  feeds. Neither is a superset and no document maps between them — this file is that map.
- >-
  Seven of the fourteen tools are cross-dataset joins with no REST equivalent. That is a real
  capability divergence, not a documentation gap: an agent gets things over MCP it cannot get
  over the API at any price tier.
- >-
  Conversely, the richest filtering in the whole Fundz surface lives only in REST, and the two
  most-marketed endpoints (/companies/:id, /fund-formations) are in neither the OpenAPI nor MCP.
- >-
  The single highest-value fix for the provider is publishing the /v1/watch/* surface and the two
  prose-only endpoints as OpenAPI. That would take tools_bound_to_openapi from 1 to 13 and give
  every MCP tool a real inputSchema.
