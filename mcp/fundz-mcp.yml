gaps:
- No hosted/remote MCP endpoint — an agent cannot reach Fundz over MCP without a human first installing the package.
- No live tools/list capture, so tool input schemas are undocumented in this catalog.
- The MCP server exposes the FundzWatch dataset, which is not the same surface as the core Fundz OpenAPI.
